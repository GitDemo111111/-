name: birthday_keeper
description: "生日管家 —— 记录亲友的生日与关键信息，在生日前 3 天和生日当天提醒你。"
publish_to: 'none'

version: 1.2.3+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 中文日期选择器等本地化文案
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.5+1

  # 本地持久化（JSON 文件）
  path_provider: ^2.1.6

  # 本地通知 + 时区
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

  # 农历（生日可以是农历）
  lunar: ^1.7.8

  # 工具
  uuid: ^4.6.0
  meta: ^1.18.0

  # Web 预览版用 localStorage 存数据
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
