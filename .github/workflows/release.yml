name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.3'
  JAVA_VERSION: '17'

permissions:
  contents: write

jobs:
  release:
    name: 打标签后自动出包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 发布前必须通过静态分析与测试
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --fatal-infos
          flutter test

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 构建分架构 APK（体积小很多，装的时候选对自己的手机那一份）
        run: flutter build apk --release --split-per-abi

      - name: 构建 Release AAB
        run: flutter build appbundle --release

      - name: 重命名产物（带上版本号）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/birthday-keeper-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "dist/birthday-keeper-${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "dist/birthday-keeper-${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/birthday-keeper-${VERSION}.aab"
          ls -lh dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
          draft: false
